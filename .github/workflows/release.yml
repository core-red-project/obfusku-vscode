name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify version matches tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Assert package.json matches the tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

  release:
    name: Build, package, and publish
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install obfusku CLI
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/core-red-project/obfusku/main/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package extension
        run: npx vsce package --no-dependencies -o "obfusku-vscode-${{ needs.verify-version.outputs.version }}.vsix"

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath "obfusku-vscode-${{ needs.verify-version.outputs.version }}.vsix"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "obfusku-vscode-${{ needs.verify-version.outputs.version }}.vsix" -p "$OVSX_PAT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: obfusku-vscode-${{ needs.verify-version.outputs.version }}.vsix
          generate_release_notes: true
          body: |
            ## Obfusku for VS Code v${{ needs.verify-version.outputs.version }}

            See [CHANGELOG.md](https://github.com/core-red-project/obfusku-vscode/blob/main/CHANGELOG.md) for details.

            ### Install
            Search **Obfusku** in the VS Code Extensions panel, or download the `.vsix`
            from this release and install manually:

            ```
            code --install-extension obfusku-vscode-${{ needs.verify-version.outputs.version }}.vsix
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
