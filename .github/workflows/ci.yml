name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: pnpm commitlint --from "origin/${{ github.base_ref }}" --to "${{ github.event.pull_request.head.sha }}"

  check:
    # The extension supports obfusku 1.0.x and 1.1.x (README, "Compatible
    # versions"); the LSP and CLI tests adapt to the pair installed here.
    name: Quality Gate (obfusku ${{ matrix.obfusku }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        obfusku: ['1.0.0', '1.1.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install just
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just@1.58.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: just install
      - name: Install obfusku CLI and language server
        env:
          OBFUSKU_VERSION: ${{ matrix.obfusku }}
          INSTALL_DIR: ${{ runner.temp }}/obfusku-bin
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/core-red-project/obfusku/main/install.sh | bash
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Installed versions match the matrix
        env:
          WANT: ${{ matrix.obfusku }}
        run: |
          set -euo pipefail
          got="$(obfusku --version | awk '{print $2}')"
          [ "$got" = "$WANT" ] || { echo "::error::obfusku is $got, expected $WANT"; exit 1; }
          command -v obfusku-lsp
      - name: Run quality gate
        run: just check
      - name: Package extension (dry run)
        if: matrix.obfusku == '1.1.0'
        run: just package
